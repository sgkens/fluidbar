
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; }
.tui-wrap {
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
  color: var(--color-text-primary);
  padding: 1rem 0;
}
.tui-panel {
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-secondary);
  border-radius: var(--border-radius-md);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.5rem;
}
.tui-title {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-text-tertiary);
  margin-bottom: 1rem;
  border-bottom: 0.5px solid var(--color-border-tertiary);
  padding-bottom: 0.5rem;
}
.bar-block { margin-bottom: 1.25rem; }
.bar-block:last-child { margin-bottom: 0; }
.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
}
.bar-label {
  min-width: 120px;
  color: var(--color-text-secondary);
  font-size: 12px;
}
.bar-track {
  flex: 1;
  letter-spacing: -0.5px;
}
.bar-pct {
  min-width: 36px;
  text-align: right;
  font-size: 12px;
  color: var(--color-text-secondary);
}
.bar-meta {
  margin-top: 2px;
  margin-left: 130px;
  font-size: 11px;
  color: var(--color-text-tertiary);
}
.bar-sub {
  margin-top: 3px;
  margin-left: 130px;
  font-size: 11px;
  display: flex;
  gap: 1.5rem;
  color: var(--color-text-tertiary);
}

/* color styles */
.c-teal   { color: #1D9E75; }
.c-blue   { color: #378ADD; }
.c-amber  { color: #BA7517; }
.c-coral  { color: #D85A30; }
.c-green  { color: #639922; }
.c-purple { color: #7F77DD; }
.c-pink   { color: #D4537E; }
.c-red    { color: #E24B4A; }
.c-gray   { color: var(--color-text-tertiary); }

.slider-row {
  display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; flex-wrap: wrap;
}
.slider-row label { font-size: 11px; color: var(--color-text-secondary); min-width: 70px; }
input[type=range] { width: 140px; }
.hint { font-size: 11px; color: var(--color-text-tertiary); }
select { font-family: var(--font-mono); font-size: 12px; padding: 2px 6px; }
</style>

<h2 class="sr-only">ASCII Extended progress bar showcase for TUI / CLI dashboards</h2>

<div class="tui-wrap">

<div class="slider-row">
  <label>Master fill</label>
  <input type="range" id="masterFill" min="0" max="100" value="70" step="1">
  <span class="hint" id="masterVal">70%</span>
  <label style="margin-left:1rem">Style</label>
  <select id="styleSelect">
    <option value="all">all styles</option>
    <option value="0">01 · block halves</option>
    <option value="1">02 · shade fill</option>
    <option value="2">03 · braille dots</option>
    <option value="3">04 · thin line</option>
    <option value="4">05 · double line</option>
    <option value="5">06 · arrow pulse</option>
    <option value="6">07 · diamond chain</option>
    <option value="7">08 · pipe fill</option>
    <option value="8">09 · wave roll</option>
    <option value="9">10 · segment LED</option>
  </select>
</div>

<div id="bars-container"></div>
</div>

<script>
const BARS = [
  {
    id: 0,
    name: "01 · block halves",
    color: "c-teal",
    label: "CPU Usage",
    pct: 72,
    meta: "6 cores · 3.8 GHz",
    sub: { left: "usr 58%", right: "sys 14%", extra: "idle 28%" },
    desc: "Uses ▏▎▍▌▋▊▉█ eighth-steps for sub-cell precision",
    render(pct, width) {
      const eighths = "▏▎▍▌▋▊▉█";
      const filled = Math.floor((pct / 100) * width);
      const frac = ((pct / 100) * width) - filled;
      const fracChar = frac > 0.01 ? eighths[Math.floor(frac * 8)] : "";
      const empty = width - filled - (fracChar ? 1 : 0);
      return `[<span class="${this.color}">${"█".repeat(filled)}${fracChar}</span>${"░".repeat(Math.max(0, empty))}]`;
    }
  },
  {
    id: 1,
    name: "02 · shade fill",
    color: "c-blue",
    label: "RAM",
    pct: 55,
    meta: "8.8 GB / 16 GB",
    sub: { left: "active 6.1G", right: "cache 2.7G", extra: "free 7.2G" },
    desc: "Transitions ░ → ▒ → ▓ → █ across fill zones",
    render(pct, width) {
      const full = Math.floor((pct / 100) * width);
      const third1 = Math.floor(full * 0.5);
      const third2 = Math.floor(full * 0.82);
      let bar = "";
      for (let i = 0; i < width; i++) {
        if (i < third1) bar += "█";
        else if (i < third2) bar += "▓";
        else if (i < full) bar += "▒";
        else bar += "░";
      }
      return `[<span class="${this.color}">${bar.slice(0, full)}</span>${bar.slice(full)}]`;
    }
  },
  {
    id: 2,
    name: "03 · braille dots",
    color: "c-purple",
    label: "Network RX",
    pct: 38,
    meta: "↓ 480 Mbps",
    sub: { left: "eth0", right: "pkts 1.2M", extra: "err 0" },
    desc: "Braille block ⣀⣄⣤⣦⣶⣷⣿ for dense micro-resolution fill",
    render(pct, width) {
      const brl = ["⠀", "⣀", "⣄", "⣤", "⣦", "⣶", "⣷", "⣿"];
      const filled = Math.floor((pct / 100) * width);
      const frac = Math.floor(((pct / 100) * width - filled) * 8);
      const empty = width - filled - (frac > 0 ? 1 : 0);
      return `[<span class="${this.color}">${"⣿".repeat(filled)}${frac > 0 ? brl[frac] : ""}</span>${"⠀".repeat(Math.max(0, empty))}]`;
    }
  },
  {
    id: 3,
    name: "04 · thin line",
    color: "c-green",
    label: "Disk Read",
    pct: 61,
    meta: "↑ 220 MB/s",
    sub: { left: "/dev/nvme0", right: "queue 4", extra: "lat 0.3ms" },
    desc: "Light box-drawing ─ for unfilled, ━ for filled section",
    render(pct, width) {
      const filled = Math.round((pct / 100) * width);
      return `├<span class="${this.color}">${"━".repeat(filled)}</span>${"─".repeat(width - filled)}┤`;
    }
  },
  {
    id: 4,
    name: "05 · double line",
    color: "c-amber",
    label: "GPU Temp",
    pct: 83,
    meta: "83 °C / 100 °C",
    sub: { left: "RTX 4070", right: "fan 78%", extra: "tdp 150W" },
    desc: "Double-rule ═ fill inside ╠ ╣ frame for bold presence",
    render(pct, width) {
      const filled = Math.round((pct / 100) * width);
      return `╠<span class="${this.color}">${"═".repeat(filled)}</span>${"─".repeat(width - filled)}╣`;
    }
  },
  {
    id: 5,
    name: "06 · arrow pulse",
    color: "c-coral",
    label: "Upload",
    pct: 44,
    meta: "↑ 55 Mbps",
    sub: { left: "WAN", right: "tx 88K pkts", extra: "drop 0%" },
    desc: "Chevron ► chains give a directional flow illusion",
    render(pct, width) {
      const filled = Math.round((pct / 100) * width);
      const head = filled > 0 ? "▶" : "";
      const body = "►".repeat(Math.max(0, filled - 1));
      const empty = "·".repeat(width - filled);
      return `[<span class="${this.color}">${body}${head}</span>${empty}]`;
    }
  },
  {
    id: 6,
    name: "07 · diamond chain",
    color: "c-pink",
    label: "Cache Hit",
    pct: 91,
    meta: "91.4% ratio",
    sub: { left: "L2 8 MB", right: "hits 2.3M", extra: "miss 210K" },
    desc: "◆ for filled cells, ◇ empty — geometric rhythm at high fill",
    render(pct, width) {
      const filled = Math.round((pct / 100) * width);
      return `[<span class="${this.color}">${"◆".repeat(filled)}</span>${"◇".repeat(width - filled)}]`;
    }
  },
  {
    id: 7,
    name: "08 · pipe fill",
    color: "c-blue",
    label: "Swap Used",
    pct: 18,
    meta: "0.9 GB / 4 GB",
    sub: { left: "zswap on", right: "pages 230K", extra: "faults 0" },
    desc: "Vertical bar ┃ fill with ╎ dotted empty — minimal noise",
    render(pct, width) {
      const filled = Math.round((pct / 100) * width);
      return `[<span class="${this.color}">${"┃".repeat(filled)}</span>${"╎".repeat(width - filled)}]`;
    }
  },
  {
    id: 8,
    name: "09 · wave roll",
    color: "c-teal",
    label: "Throughput",
    pct: 67,
    meta: "1.34 Gbps",
    sub: { left: "bond0", right: "irq bal", extra: "offload on" },
    desc: "Alternating ∿ ≈ ~ gives a sinusoidal wave texture",
    render(pct, width) {
      const filled = Math.round((pct / 100) * width);
      const wave = ["∿", "≈", "~"];
      let bar = "";
      for (let i = 0; i < filled; i++) bar += wave[i % 3];
      bar += "·".repeat(width - filled);
      return `[<span class="${this.color}">${bar.slice(0, filled)}</span>${bar.slice(filled)}]`;
    }
  },
  {
    id: 9,
    name: "10 · segment LED",
    color: "c-amber",
    label: "Battery",
    pct: 76,
    meta: "76% · 3h 12m left",
    sub: { left: "charging", right: "9.2V 2.1A", extra: "cycles 247" },
    desc: "▐█▌ filled segments vs ▐░▌ empty — simulates LED segments",
    render(pct, width) {
      const segs = Math.floor(width / 3);
      const filledSegs = Math.round((pct / 100) * segs);
      let bar = "";
      for (let i = 0; i < segs; i++) {
        if (i < filledSegs) bar += `<span class="${this.color}">▐█▌</span>`;
        else bar += `▐░▌`;
      }
      return `[${bar}]`;
    }
  }
];

function render() {
  const masterPct = parseInt(document.getElementById('masterFill').value);
  document.getElementById('masterVal').textContent = masterPct + '%';
  const styleVal = document.getElementById('styleSelect').value;
  const container = document.getElementById('bars-container');

  const toShow = styleVal === 'all' ? BARS : [BARS[parseInt(styleVal)]];
  const trackWidth = styleVal === 'all' ? 32 : 40;

  container.innerHTML = toShow.map(b => {
    const pct = masterPct;
    const barHtml = b.render(pct, trackWidth);
    return `<div class="tui-panel">
      <div class="tui-title">${b.name}</div>
      <div class="bar-block">
        <div class="bar-row">
          <span class="bar-label">${b.label}</span>
          <span class="bar-track">${barHtml}</span>
          <span class="bar-pct">${pct}%</span>
        </div>
        <div class="bar-meta">${b.meta}</div>
        <div class="bar-sub">
          <span>${b.sub.left}</span>
          <span>${b.sub.right}</span>
          <span>${b.sub.extra}</span>
        </div>
      </div>
      <div style="margin-top:10px; font-size:11px; color:var(--color-text-tertiary); font-family:var(--font-mono)">${b.desc}</div>
    </div>`;
  }).join('');
}

document.getElementById('masterFill').addEventListener('input', render);
document.getElementById('styleSelect').addEventListener('change', render);
render();
</script>
